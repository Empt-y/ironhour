# A mixed selection ordered across Tournament Desert as one group
# (AIGroup::groupMoveToPosition): four Crusaders and six Rangers set off together
# along a shared ground path (the Rangers in columns), and each unit stops in its
# own spot near the goal. Then a click inside the group's own box gathers it
# (groupTightenToPosition).
