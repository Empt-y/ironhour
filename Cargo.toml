[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
ih-vfs = { path = "crates/ih-vfs" }
ih-ini = { path = "crates/ih-ini" }
ih-formats = { path = "crates/ih-formats" }
ih-render = { path = "crates/ih-render" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
winreg = "0.55"
tempfile = "3"
png = "0.17"

[profile.dev.package."*"]
opt-level = 2
